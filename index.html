<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>구간 재생</title>
<style>
:root{--bg:#f6f4ef;--fg:#1c1b19;--mut:#6b675f;--ac:#1b6c80;--card:#fff;--bd:#e3ded4}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--fg:#ecebe6;--mut:#9c988f;--card:#1f1e1c;--bd:#33312d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:4px 0 12px}
.pf{aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}#p{width:100%;height:100%}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
button{font:inherit;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
#st{color:var(--mut);font-size:14px}
ol{list-style:none;padding:0;margin:0;display:grid;gap:6px}
li{display:flex;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);cursor:pointer}
li.on{border-color:var(--ac);box-shadow:inset 3px 0 0 var(--ac)}
li .t{font-family:ui-monospace,monospace;color:var(--ac);font-weight:600;white-space:nowrap}
li .l{flex:1;min-width:0}
li.sub{margin-left:22px}
li .x{padding:2px 10px;font-size:14px;border-radius:8px;color:#b42318;border-color:#f1c4bf;background:transparent}
li.dropped{opacity:.45}li.dropped .l{text-decoration:line-through}li.dropped .x{color:var(--ac);border-color:var(--bd)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1c1b19;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;max-width:92vw;display:none}
.sum{display:flex;flex-wrap:wrap;gap:6px 18px;margin:-4px 0 10px;color:var(--mut);font-size:14px}.sum b{color:var(--fg);font-variant-numeric:tabular-nums}
.prog{height:6px;background:var(--bd);border-radius:3px;margin:0 0 12px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--ac)}
.au{display:flex;gap:6px;align-items:center;font-size:14px;cursor:pointer}
</style></head><body><main>
<h1 id="ttl">구간 재생</h1>
<div class="sum"><span>총 길이 <b id="tot">-</b></span><span>편집점 <b id="cnt">-</b></span><span>지금 <b id="el">0:00</b> / <b id="tot2">-</b></span></div>
<div class="prog"><i id="pg"></i></div>
<div class="pf"><div id="p"></div></div>
<div class="bar"><button class="pri" id="all">▶ 처음부터 전체 이어 보기</button><button id="prev">◀ 이전 편집점</button><button id="replay">↺ 이 편집점 다시</button><button id="nextseg">다음 조각 ▶</button><button id="next">다음 편집점 ▶▶</button><label class="au"><input type="checkbox" id="auto"> 끝나면 다음 편집점 자동 재생</label><span id="st"></span></div>
<ol id="list"></ol>
<div id="toast"></div>
</main>
<script>
const q=new URLSearchParams(location.search);
const VID=q.get("v")||"";
const fmt=s=>{s=Math.round(s);const h=s/3600|0,m=(s%3600)/60|0,x=s%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")};
// i=편집점 ID(편집점마다)  v=영상ID  s=시작-끝,시작-끝  n=라벨|라벨  g=편집점번호,편집점번호(조각마다)  k=시작 편집점 순번  a=1 자동 이어보기
const labels=(q.get("n")||"").split("|");
const gids=(q.get("g")||"").split(",");
const SEG=(q.get("s")||"").split(",").filter(Boolean).map((p,i)=>{const [a,b]=p.split("-").map(Number);return {a,b,l:labels[i]||"",g:gids[i]!==undefined&&gids[i]!==""?gids[i]:String(i)}});
const GROUPS=[...new Set(SEG.map(x=>x.g))];
document.getElementById("ttl").textContent=q.get("t")||"구간 재생";
document.title=q.get("t")||"구간 재생";
const auto=document.getElementById("auto"); auto.checked=q.get("a")==="1";
const list=document.getElementById("list");
const IDS=(q.get("i")||"").split(",");
const DROP=new Set(), PDROP=new Set();
const multi=g=>SEG.filter(x=>x.g===g).length>1;
const pieceK=i=>i-SEG.findIndex(x=>x.g===SEG[i].g);
const isOff=i=>DROP.has(SEG[i].g)||PDROP.has(i);
list.innerHTML=SEG.map((g,i)=>{ const first=!(i>0&&SEG[i-1].g===g.g); return `<li data-i="${i}" data-g="${g.g}" class="${first?"":"sub"}"><span class="t">${fmt(g.a)}~${fmt(g.b)}</span><span class="l"></span>${multi(g.g)?`<button class="x xp" data-xp="${i}" title="이 조각만 빼기">조각 ✕</button>`:""}${first?`<button class="x" data-x="${g.g}" title="이 편집점 전체 빼기 (결재 페이지에서 2순위로)">${multi(g.g)?"전체 ✕":"✕"}</button>`:""}</li>`; }).join("");
[...list.children].forEach((li,i)=>li.querySelector(".l").textContent=SEG[i].l);
let P,cur=-1,loaded=false;
const st=t=>document.getElementById("st").textContent=t;
const gi=i=>GROUPS.indexOf(SEG[i].g);
const firstOf=k=>SEG.findIndex(x=>x.g===GROUPS[k]);
function mark(){[...list.children].forEach((li,i)=>li.classList.toggle("on",i===cur)); const on=list.children[cur]; on&&on.scrollIntoView({block:"nearest"});}
function go(i){ while(i>=0&&i<SEG.length&&isOff(i)) i++; if(i<0||i>=SEG.length){ P&&P.pauseVideo(); st("끝"); cur=-1; mark(); return; } cur=i; mark();
  if(loaded){ P.seekTo(SEG[i].a,true); P.playVideo(); } else { P.loadVideoById({videoId:VID,startSeconds:SEG[i].a}); loaded=true; } st(`편집점 ${gi(i)+1}/${GROUPS.length} · ${fmt(SEG[i].a)}~${fmt(SEG[i].b)}`); }
function goGroup(k){ if(k<0) k=0; if(k>=GROUPS.length){ P.pauseVideo(); st("마지막 편집점입니다"); return; } go(firstOf(k)); }
function tick(){ if(!P||cur<0||!P.getCurrentTime) return; const t=P.getCurrentTime();
  if(t>=SEG[cur].b-0.15){ let nx=cur+1; while(nx<SEG.length&&isOff(nx)) nx++; const same=nx<SEG.length&&SEG[nx].g===SEG[cur].g;
    if(same||(auto.checked&&nx<SEG.length)) go(nx); else { P.pauseVideo(); st(`편집점 ${gi(cur)+1}/${GROUPS.length} 끝에서 멈춤`); cur=-1; mark(); } } }
let TOT=0, BEFORE=[];
function recalc(){ const live=SEG.map((g,i)=>!isOff(i)); TOT=SEG.reduce((s,g,i)=>s+(live[i]?g.b-g.a:0),0); let acc=0; BEFORE=SEG.map((g,i)=>{ const v=acc; if(live[i]) acc+=g.b-g.a; return v; });
  document.getElementById("tot").textContent=fmt(TOT); document.getElementById("tot2").textContent=fmt(TOT);
  const ng=GROUPS.filter(x=>!DROP.has(x)).length; document.getElementById("cnt").textContent=ng+"개 · "+live.filter(Boolean).length+"조각"+(DROP.size||PDROP.size?` (뺀 편집점 ${DROP.size}개 · 뺀 조각 ${PDROP.size}개)`:"");
  [...list.children].forEach((li,i)=>{ li.classList.toggle("dropped",isOff(i)); const x=li.querySelector("[data-x]"); if(x){ x.textContent=DROP.has(SEG[i].g)?"되살리기":(multi(SEG[i].g)?"전체 ✕":"✕"); } const xp=li.querySelector("[data-xp]"); if(xp){ xp.textContent=PDROP.has(i)?"조각 되살리기":"조각 ✕"; xp.hidden=DROP.has(SEG[i].g); } }); }
recalc();
setInterval(()=>{ if(!P||!P.getCurrentTime||cur<0) return; const el=BEFORE[cur]+Math.max(0,Math.min(SEG[cur].b,P.getCurrentTime())-SEG[cur].a);
  document.getElementById("el").textContent=fmt(el); document.getElementById("pg").style.width=(TOT?100*el/TOT:0)+"%"; },250);
const K=Math.max(0,Math.min(GROUPS.length-1,+(q.get("k")||0)));
window.onYouTubeIframeAPIReady=()=>{ P=new YT.Player("p",{videoId:VID,playerVars:{start:SEG.length?SEG[firstOf(K)].a:0,rel:0,playsinline:1},events:{onReady:()=>{ if(SEG.length) go(firstOf(K)); }}}); setInterval(tick,100); };
let last=0; const curG=()=>cur>=0?gi(cur):last;
document.getElementById("all").onclick=()=>{ auto.checked=true; go(0); };
document.getElementById("replay").onclick=()=>goGroup(curG());
document.getElementById("next").onclick=()=>goGroup(curG()+1);
document.getElementById("nextseg").onclick=()=>{ const i=cur>=0?cur:firstOf(last); go(i+1); };
document.getElementById("prev").onclick=()=>goGroup(curG()-1);
setInterval(()=>{ if(cur>=0) last=gi(cur); },200);
const toast=(t,ms)=>{ const el=document.getElementById("toast"); el.textContent=t; el.style.display="block"; clearTimeout(toast.h); toast.h=setTimeout(()=>el.style.display="none",ms||3500); };
const pending={};
addEventListener("message",e=>{ const d=e.data; if(!d||d.type!=="kirei-ack") return; clearTimeout(pending[d.id]); delete pending[d.id]; if(d.piece){ toast(`결재 페이지에서 ${d.no}번 ${d.piece}조각을 ${d.drop?"뺐습니다":"되살렸습니다"}`); return; } toast(d.drop?`결재 페이지에서 ${d.no}번을 2순위로 내렸습니다`:`결재 페이지에서 ${d.no}번을 다시 1순위로 올렸습니다`); });
function sendDrop(g,drop){ const id=IDS[+g]; const lab=(SEG.find(x=>x.g===g)||{}).l||""; const no=(lab.match(/^(\d+)번/)||[])[1]||"";
  let sent=false; try{ if(window.opener&&id){ window.opener.postMessage({type:"kirei-drop",id,drop},"*"); sent=true; } }catch(_){}
  if(!sent){ toast(`결재 페이지와 연결이 안 돼 있습니다. 결재 페이지에서 ${no}번을 직접 ${drop?"빼기":"살림"}으로 눌러 주세요.`,6000); return; }
  pending[id]=setTimeout(()=>toast(`결재 페이지 응답이 없습니다. 결재 페이지에서 ${no}번을 직접 ${drop?"빼기":"살림"}으로 눌러 주세요.`,6000),1500); }
function sendPiece(i,drop){ const g=SEG[i].g, id=IDS[+g], k=pieceK(i); const no=((SEG[i].l||"").match(/^(\d+)번/)||[])[1]||"";
  let sent=false; try{ if(window.opener&&id){ window.opener.postMessage({type:"kirei-piece",id,k,drop},"*"); sent=true; } }catch(_){}
  const msg=`결재 페이지에서 ${no}번 ${k+1}조각을 직접 ${drop?"빼":"되살려"} 주세요.`;
  if(!sent){ toast("결재 페이지와 연결이 안 돼 있습니다. "+msg,6000); return; }
  pending[id]=setTimeout(()=>toast("결재 페이지 응답이 없습니다. "+msg,6000),1500); }
list.onclick=e=>{ const xp=e.target.closest("[data-xp]"); if(xp){ const i=+xp.dataset.xp, drop=!PDROP.has(i); drop?PDROP.add(i):PDROP.delete(i); recalc(); if(drop&&cur===i){ go(i+1); } sendPiece(i,drop); return; }
  const x=e.target.closest("[data-x]"); if(x){ const g=x.dataset.x, drop=!DROP.has(g); drop?DROP.add(g):DROP.delete(g); recalc(); if(drop&&cur>=0&&SEG[cur].g===g){ goGroup(gi(cur)+1); } sendDrop(g,drop); return; }
  const li=e.target.closest("li"); if(li) go(+li.dataset.i) };
if(!VID||!SEG.length) st("주소에 v(영상 ID)와 s(구간)가 필요합니다.");
const sc=document.createElement("script"); sc.src="https://www.youtube.com/iframe_api"; document.head.appendChild(sc);
</script></body></html>
